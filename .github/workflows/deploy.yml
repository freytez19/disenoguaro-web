name: Deploy a disenoguaro.com

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Versionar CSS y JS (para que el navegador tome los cambios al instante)
        run: |
          V="${GITHUB_SHA::8}"
          for f in site/index.html site/trabajos.html; do
            sed -i "s#assets/css/style\.css#assets/css/style.css?v=$V#g; s#assets/js/main\.js#assets/js/main.js?v=$V#g" "$f"
          done
          echo "Versión aplicada: $V"
          grep -oE "assets/(css|js)/[a-z]+\.[a-z]+\?v=[a-f0-9]+" site/index.html || true

      - name: Subir el sitio por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps
          local-dir: ./site/
          server-dir: ./
          # No borra nada que no venga del repo (wordpress-backup y demás quedan intactos).
          dangerous-clean-slate: false
