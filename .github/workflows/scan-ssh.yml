name: Buscar puerto SSH

on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Escanear servidor (SSH, FTP y web)
        run: |
          set +e
          HOSTS="216.246.46.74 disenoguaro.com bh8934.banahosting.com server.banahosting.com"
          PORTS="21 22 80 443 465 587 990 993 995 2020 2022 2077 2078 2083 2087 2096 2200 2211 2222 5567 6543 7822 8022 10022 12141 17177 18765 21098 22222 30022"

          for H in $HOSTS; do
            IP=$(getent hosts "$H" | awk '{print $1}' | head -1)
            echo "=============================================="
            echo "HOST: $H   (IP: ${IP:-no resuelve})"
            echo "=============================================="
            [ -z "$IP" ] && continue
            for p in $PORTS; do
              if timeout 6 bash -c "cat < /dev/null > /dev/tcp/$H/$p" 2>/dev/null; then
                B=$(timeout 6 bash -c "exec 3<>/dev/tcp/$H/$p; head -c 80 <&3" 2>/dev/null | tr -cd '[:print:]')
                echo "  PUERTO $p -> ABIERTO    $B"
              fi
            done
          done
          echo "=============================================="
          echo "Fin del escaneo."
